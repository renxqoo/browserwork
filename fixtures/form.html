<!doctype html>
<html lang="zh-CN">
  <head>
    <title>BW Fixture Form</title>
  </head>
  <body>
    <h1>Form</h1>
    <form action="/submitted" method="get">
      <input type="text" name="q" placeholder="Type a query" />
      <input type="password" name="secret" placeholder="never shown" />
      <select name="mode" id="mode">
        <option value="fast">fast</option>
        <option value="slow">slow</option>
      </select>
      <button type="submit">Submit query</button>
    </form>
  </body>
</html>
