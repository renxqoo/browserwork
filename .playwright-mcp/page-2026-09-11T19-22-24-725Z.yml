              - text: "#"
          - paragraph [ref=e436]: Bun ships as a single, dependency-free binary and includes a runtime, package manager, test runner, and bundler. New to Bun?
          - generic [ref=e437]:
            - link [ref=e439] [cursor=pointer]:
