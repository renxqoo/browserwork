          - separator [ref=e461]
          - heading [level=2] [ref=e462]:
            - text: What's Inside
            - link "Permalink" [ref=e463] [cursor=pointer]:
              - /url: "#what-s-inside"
              - text: "#"
          - list [ref=e464]:
            - listitem [ref=e465]: "Runtime: Execute JavaScript/TypeScript files and package scripts with near-zero overhead."
            - listitem [ref=e466]:
              - text: "Package Manager: Fast installs, workspaces, overrides, and audits with"
              - code [ref=e467]: bun install
              - text: .
            - listitem [ref=e468]: "Test Runner: Jest-compatible, TypeScript-first tests with snapshots, DOM, and watch mode."
            - listitem [ref=e469]: "Bundler: Native bundling for JS/TS/JSX with splitting, plugins, and HTML imports."
          - paragraph [ref=e470]: Explore each area using the cards above. Each section is structured with an overview, short examples, reference, and best practices for fast scanning and deep dives.
          - separator [ref=e471]
          - heading [level=2] [ref=e472]:
            - text: What is Bun?
            - link "Permalink" [ref=e473] [cursor=pointer]:
              - /url: "#what-is-bun"
              - text: "#"
          - paragraph [ref=e474]:
            - text: Bun is an all-in-one toolkit for JavaScript and TypeScript apps. It ships as a single executable called
            - code [ref=e475]: bun
            - text: .
          - paragraph [ref=e476]:
            - text: At its core is the
            - emphasis [ref=e477]: Bun runtime
            - text: ", a fast JavaScript runtime designed as"
            - strong [ref=e478]: a drop-in replacement for Node.js
            - text: . It's written in Rust and powered by JavaScriptCore, reducing startup time and memory usage.
          - generic [ref=e479]:
            - generic [ref=e480]: terminal
            - generic [ref=e488]:
              - code [ref=e492]:
                - generic [ref=e493]: "$ bun run index.tsx # TS and JSX supported by default"
              - button "Copy to clipboard" [ref=e494] [cursor=pointer]
          - paragraph [ref=e501]:
            - text: The
            - code [ref=e502]: bun
            - text: command-line tool also implements a test runner, script runner, and Node.js-compatible package manager. All three are significantly faster than existing tools, and you can use them in existing Node.js projects with little to no changes.
          - generic [ref=e503]:
            - generic [ref=e504]: terminal
            - generic [ref=e512]:
              - code [ref=e516]:
                - generic [ref=e517]: "$ bun run start # run the `start` script"
                - generic [ref=e518]: "$ bun install <pkg> # install a package"
                - generic [ref=e519]: "$ bun build ./index.tsx # bundle a project for browsers"
                - generic [ref=e520]: "$ bun test # run tests"
                - generic [ref=e521]: "$ bunx cowsay 'Hello, world!' # execute a package"
              - button "Copy to clipboard" [ref=e522] [cursor=pointer]
          - heading [level=2] [ref=e529]:
            - text: What is a runtime?
            - link "Permalink" [ref=e530] [cursor=pointer]:
              - /url: "#what-is-a-runtime"
              - text: "#"
          - paragraph [ref=e531]:
            - text: JavaScript (or, more formally, ECMAScript) is only a
            - emphasis [ref=e532]: specification
            - text: for a programming language. Anyone can write a JavaScript
            - emphasis [ref=e533]: engine
            - text: that ingests a valid JavaScript program and executes it. The two most popular engines in use today are V8 (developed by Google) and JavaScriptCore (developed by Apple). Both are open source.
          - paragraph [ref=e534]:
            - text: But most JavaScript programs don't run in a vacuum. They need a way to access the outside world to perform useful tasks. This is where
            - emphasis [ref=e535]: runtimes
            - text: come in. They implement additional APIs and make them available to the JavaScript programs they execute.
          - heading [level=3] [ref=e536]:
            - text: Browsers
            - link "Permalink" [ref=e537] [cursor=pointer]:
              - /url: "#browsers"
              - text: "#"
          - paragraph [ref=e538]:
            - text: Browsers ship with JavaScript runtimes that implement a set of Web-specific APIs, exposed on the global
            - code [ref=e539]: window
            - text: object. Any JavaScript code executed by the browser can use these APIs to add interactive or dynamic behavior to the current webpage.
          - heading [level=3] [ref=e540]:
            - text: Node.js
            - link "Permalink" [ref=e541] [cursor=pointer]:
              - /url: "#node-js"
              - text: "#"
          - paragraph [ref=e542]:
            - text: Node.js is a JavaScript runtime for non-browser environments, like servers. JavaScript programs executed by Node.js have access to a set of Node.js-specific
            - link "globals" [ref=e543] [cursor=pointer]:
              - /url: https://nodejs.org/api/globals.html
            - text: like
            - code [ref=e544]: Buffer
            - text: ","
            - code [ref=e545]: process
            - text: ", and"
            - code [ref=e546]: __dirname
            - text: in addition to built-in modules for OS-level tasks like reading/writing files (
            - code [ref=e547]: node:fs
            - text: ) and networking (
            - code [ref=e548]: node:net
            - text: ","
            - code [ref=e549]: node:http
            - text: ). Node.js also implements a CommonJS-based module system and resolution algorithm that pre-dates JavaScript's native module system.
          - paragraph [ref=e550]: Bun is designed as a faster, leaner, more modern replacement for Node.js.
          - heading [level=2] [ref=e551]:
            - text: Design goals
            - link "Permalink" [ref=e552] [cursor=pointer]:
              - /url: "#design-goals"
              - text: "#"
          - paragraph [ref=e553]: Bun is designed from the ground-up with today's JavaScript ecosystem in mind.
          - list [ref=e554]:
            - listitem [ref=e555]:
              - strong [ref=e556]: Speed
              - text: . Bun processes start
              - link "4x faster than Node.js" [ref=e557] [cursor=pointer]:
                - /url: https://twitter.com/jarredsumner/status/1499225725492076544
              - text: .
            - listitem [ref=e558]:
              - strong [ref=e559]: TypeScript & JSX support
              - text: . You can directly execute
              - code [ref=e560]: .jsx
              - text: ","
              - code [ref=e561]: .ts
              - text: ", and"
              - code [ref=e562]: .tsx
              - text: files; Bun's transpiler converts these to vanilla JavaScript before execution.
            - listitem [ref=e563]:
              - strong [ref=e564]: ESM & CommonJS compatibility
              - text: . The world is moving towards ES modules (ESM), but millions of packages on npm still require CommonJS. Bun recommends ES modules, but supports CommonJS.
            - listitem [ref=e565]:
              - strong [ref=e566]: Web-standard APIs
              - text: . Bun implements standard Web APIs like
              - code [ref=e567]: fetch
              - text: ","
              - code [ref=e568]: WebSocket
              - text: ", and"
              - code [ref=e569]: ReadableStream
              - text: . Bun is powered by the JavaScriptCore engine, which is developed by Apple for Safari, so some APIs like
              - link [ref=e570] [cursor=pointer]:
                - /url: https://developer.mozilla.org/en-US/docs/Web/API/Headers
                - code [ref=e571]: Headers
              - text: and
              - link [ref=e572] [cursor=pointer]:
                - /url: https://developer.mozilla.org/en-US/docs/Web/API/URL
                - code [ref=e573]: URL
              - text: directly use
              - link "Safari's implementation" [ref=e574] [cursor=pointer]:
                - /url: https://github.com/oven-sh/bun/blob/HEAD/src/jsc/bindings/webcore/JSFetchHeaders.cpp
              - text: .
            - listitem [ref=e575]:
              - strong [ref=e576]: Node.js compatibility
              - text: . In addition to supporting Node-style module resolution, Bun aims for full compatibility with built-in Node.js globals (
              - code [ref=e577]: process
              - text: ","
              - code [ref=e578]: Buffer
              - text: ) and modules (
              - code [ref=e579]: path
              - text: ","
              - code [ref=e580]: fs
              - text: ","
              - code [ref=e581]: http
              - text: ).
