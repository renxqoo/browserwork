              - strong [ref=f1e1477]: not
              - text: keep Bun's event loop alive on its own. An open
              - code [ref=f1e1478]: WebView
              - text: keeps the process alive only while it has a pending operation (such as an unsettled
              - code [ref=f1e1479]: navigate()
              - text: or
              - code [ref=f1e1480]: evaluate()
              - text: ). Once you
              - code [ref=f1e1481]: close()
              - text: the last view — or the last pending operation settles — Bun exits naturally.
            - heading [level=3] [ref=f1e1482]:
              - text: Subprocess death
              - link "Permalink" [ref=f1e1483] [cursor=pointer]:
                - /url: "#subprocess-death"
                - text: "#"
            - paragraph [ref=f1e1484]:
              - text: If the browser subprocess dies unexpectedly (crash, OOM-kill,
              - code [ref=f1e1485]: SIGKILL
              - text: ), every pending promise on every view rejects with an error describing how it died (
              - code [ref=f1e1486]: "\"Chrome killed by signal 9\""
              - text: ","
              - code [ref=f1e1487]: "\"WebView host process died\""
              - text: ). Further operations on those views throw.
            - separator [ref=f1e1488]
            - heading [level=2] [ref=f1e1489]:
              - text: Concurrency model
              - link "Permalink" [ref=f1e1490] [cursor=pointer]:
                - /url: "#concurrency-model"
                - text: "#"
            - paragraph [ref=f1e1491]: "Each view has a small number of independent operation \"slots\". One operation of each kind may be in flight at a time:"
            - list [ref=f1e1492]:
              - listitem [ref=f1e1493]:
                - text: one
                - code [ref=f1e1494]: navigate()
                - text: (shared with
                - code [ref=f1e1495]: reload()
                - text: /
                - code [ref=f1e1496]: goBack()
                - text: /
                - code [ref=f1e1497]: goForward()
                - text: on the Chrome backend)
              - listitem [ref=f1e1498]:
                - text: one
                - code [ref=f1e1499]: evaluate()
              - listitem [ref=f1e1500]:
                - text: one
                - code [ref=f1e1501]: screenshot()
              - listitem [ref=f1e1502]:
                - text: one
                - code [ref=f1e1503]: cdp()
                - text: (Chrome only)
              - listitem [ref=f1e1504]:
                - text: one "simple" operation —
                - code [ref=f1e1505]: click()
                - text: ","
                - code [ref=f1e1506]: type()
                - text: ","
                - code [ref=f1e1507]: press()
                - text: ","
                - code [ref=f1e1508]: scroll()
                - text: ","
                - code [ref=f1e1509]: scrollTo()
                - text: ","
                - code [ref=f1e1510]: resize()
                - text: (and
                - code [ref=f1e1511]: reload()
                - text: /
                - code [ref=f1e1512]: goBack()
                - text: /
                - code [ref=f1e1513]: goForward()
                - text: on the WebKit backend) share this slot
            - paragraph [ref=f1e1514]:
              - text: Starting a second operation while its slot is occupied throws
              - code [ref=f1e1515]: ERR_INVALID_STATE
              - text: synchronously — it does
              - strong [ref=f1e1516]: not
              - text: queue. In practice,
              - code [ref=f1e1517]: await
              - text: each call.
            - paragraph [ref=f1e1518]:
              - text: Operations on
              - strong [ref=f1e1519]: different views
              - text: are fully independent and run in parallel — each view has its own renderer process.
